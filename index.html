<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPE Produções - Peaky Blinders</title>
        <link rel="icon" href="imagens/LogoVP 1.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #080706;
            color: #ffffff;
            overflow: hidden;
        }

        /* Seção Principal (Hero Banner) */
        .hero {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            background-image: url('./imagens/img-capa-peaky-.png');
            background-size: cover;
            background-repeat: no-repeat;
        }


        /* Container do conteúdo */
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 500px;
            margin-left: 6%;
            padding: 20px;
        }

        /* Título Principal */
        .hero-title {
            font-family: 'Oswald', sans-serif;
            font-size: 80px;
            font-weight: 700;
            line-height: 0.95;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
            color: #ffffff;
        }

        /* Parágrafo descritivo */
        .hero-description {
            font-family: "Montserrat", sans-serif;
            font-size: 20px;
            line-height: 1.5;
            color: #e0e0e0;
            max-width: 400px;
            margin-bottom: 28px;
            text-align: justify;
        }

        /* Botão Explorar */
        .btn-explorar {
            display: inline-block;
            background-color: #B89B29;
            color: #1A1A1A;
            font-family: 'Roboto', sans-serif;
            font-size: 25px;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 1px;
            padding: 13px 10px;
            border-radius: 8px;
            border: none;
            box-shadow: inset 0 8px 20px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-explorar:hover {
            background-color: #cca149;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .hero{
                background-position: center;
            }
            .hero-content {
                margin-left: 0;
                padding: 30px;
                
            }

            .hero-title {
                font-size: 2.5rem;
            }

            .hero::before {
                background: rgba(10, 9, 7, 0.78);
            }
            .hero-description{
                font-size: 1rem;
            }
            .btn-explorar{
    width: 100%; 
    text-align: center;
            }
            
        }
@media (max-width: 600px) {
    .btn-explorar {
    font-size: 16px;
    padding: 12px 16px;
    }
}
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">VIPE<br>PRODUÇÕES</h1>
            <p class="hero-description">
                A VIPE Produções dá vida a histórias marcantes no cinema. Mergulhe no universo sombrio e estratégico de Peaky Blinders, nosso principal destaque, e descubra produções feitas para prender você do início ao fim.
            </p>
            <a href="inicio.html" class="btn-explorar">EXPLORAR</a>
        </div>
    </section>

</body>
</html>
